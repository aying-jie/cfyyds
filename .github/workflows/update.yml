name: Auto IP Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'   # 每 4 小时运行一次，UTC 时间

permissions:
  contents: write

concurrency:
  group: auto-ip-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generate version
        run: |
          echo "update_version=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"

      - name: Run IP collector script
        run: |
          python ayingcf.py

      - name: Commit and push IP results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ipv4.txt ipv6.txt

          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "Updated at ${update_version}"
            git push
          fi
