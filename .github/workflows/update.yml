name: Update CF IP Lists

on:
  schedule:
    # UTC 时间，每 6 小时运行一次
    # 北京时间大约是 02:00、08:00、14:00、20:00
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write


concurrency:
  group: update-cf-ip
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run script
        run: python cf_ip.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipv4.txt ipv6.txt || true
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "Auto update IP lists: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
